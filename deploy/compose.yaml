name: ${COMPOSE_PROJECT_NAME:-membrane-review}

x-app: &app
  image: ${APP_IMAGE:-membrane-review-app:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  environment: &app-env
    APP_ENV: deployment
    APP_DEBUG: "false"
    AUTH_ENABLED: "true"
    RUNTIME_MODE: full
    DATABASE_URL: ""
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: engineering
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_deployment.py}
    DB_NAME: engineering_db
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate deployment credentials}
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-membrane}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Generate deployment credentials}
    MINIO_SECURE: "false"
    LOCAL_UPLOAD_PATH: /app/data/uploads
    TEMPORAL_ENABLED: "true"
    TEMPORAL_TARGET: temporal:7233
    TEMPORAL_TASK_QUEUE: membrane-deploy-v1
    TEMPORAL_PARSE_TASK_QUEUE: membrane-deploy-v1-parse
    TEMPORAL_REVIEW_TASK_QUEUE: membrane-deploy-v1-review
    TEMPORAL_MAINTENANCE_TASK_QUEUE: membrane-deploy-v1-maintenance
    TRACE_CONTENT: "false"
    LOG_LEVEL: INFO
  volumes:
    - uploads:/app/data/uploads
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment credentials}
      POSTGRES_DB: engineering_db
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U engineering -d engineering_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate deployment credentials}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: membrane-review-minio:2025-09-07
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-membrane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Generate deployment credentials}
    volumes:
      - minio:/data

  temporal-postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Generate deployment credentials}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.0
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Generate deployment credentials}
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233

  migrate:
    <<: *app
    command: [migrate]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      temporal:
        condition: service_started

  api:
    <<: *app
    command: [api]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      api:
        condition: service_healthy

  web:
    image: membrane-review-web:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 10

  mcp:
    <<: *app
    profiles: [mcp]
    command: [mcp]
    restart: unless-stopped
    environment:
      <<: *app-env
      MCP_ENABLED: "true"
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      api:
        condition: service_healthy

  smoke:
    <<: *app
    profiles: [validation]
    command: [smoke]
    restart: "no"
    environment:
      <<: *app-env
      DEPLOYMENT_API_URL: http://api:8080
    volumes:
      - uploads:/app/data/uploads
      - validation-results:/app/data/runtime/deployment
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      web:
        condition: service_healthy

volumes:
  postgres:
  redis:
  minio:
  temporal-postgres:
  uploads:
  validation-results:
