name: Project checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
    inputs:
      run_compose:
        description: Build the complete Full/Fake stack and run synthetic acceptance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RUNTIME_MODE: local
      MODEL_MODE: fake
      PARSER_MODE: basic
      TEMPORAL_ENABLED: 'false'
      AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check src scripts test alembic deploy
      - run: python scripts/validate_data.py
      - run: python scripts/validate_repository.py
      - run: python -m pytest -q -p no:cacheprovider -p pytest_asyncio.plugin --junitxml=data/runtime/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: data/runtime/ci-tests.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated credentials
        run: python scripts/init_deployment.py
      - name: Validate and build
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --build
      - name: Exercise actual stack
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile validation run --rm smoke
      - name: Export safe acceptance summary
        if: always()
        run: |
          mkdir -p deploy/results
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile validation run --rm --no-deps --entrypoint python smoke -c "from pathlib import Path; print(Path('/app/data/runtime/deployment/latest.json').read_text())" > deploy/results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-synthetic-acceptance
          path: deploy/results/summary.json
      - name: Stop isolated CI stack
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml down
